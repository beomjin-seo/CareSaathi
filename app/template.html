/* Layout: three short picture questions, then a delivery-app style answer: a real map on the left with you and five numbered places, a ranked list on the right; each card opens to WHY and HOW. */
:root{

  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:14px 40px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

.small{font-size:12.5px;color:var(--muted);font-weight:700}
.lab{font-size:12.5px;font-weight:900;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

.quote.q2{background:var(--soft);font-size:16px}

.cost{background:var(--warnbg);color:#6B4A00;border-radius:14px;padding:10px 13px;font-weight:700;font-size:14px}

const hav=(a,b,c,d)=>{const R=Math.PI/180,x=Math.sin((c-a)*R/2)**2+Math.cos(a*R)*Math.cos(c*R)*Math.sin((d-b)*R/2)**2;return 12742*Math.asin(Math.sqrt(x));};

function resolve(q){q=q.trim();if(!q)return null;
  let m=q.replace(/\s/g,'').match(/^(\d{6})$/);if(m){const p=D.pins[m[1]];return p?{lat:p[0],lon:p[1],pl:p[2],label:'PIN '+m[1]}:null;}
  m=q.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);if(m)return nearPlace(+m[1],+m[2],q);
  const c=CITY[q.toLowerCase()];if(c)return{lat:c[1],lon:c[2],pl:c[3],label:c[0]};
  const k=Object.keys(CITY).find(x=>x.startsWith(q.toLowerCase()));if(k){const c2=CITY[k];return{lat:c2[1],lon:c2[2],pl:c2[3],label:c2[0]};}
  return null;}
function nearPlace(lat,lon,label){let best=null,bd=1e9;for(const k in D.pins){const p=D.pins[k],d=(p[0]-lat)**2+(p[1]-lon)**2;if(d<bd){bd=d;best=p;}}return{lat,lon,pl:best?best[2]:null,label:label||'My location'};}

/* Ranking.  Emergency: nearest first among places that pass the evidence check.  Planned: highest trust first inside the local area. */
function search(){
  const cl=CL[svc].c, all=[];
  for(const k in cl){const f=FAC[k],c=cl[k];all.push({i:+k,f,c,d:hav(here.lat,here.lon,f[3],f[4])});}
  const ok=all.filter(x=>!x.c[8]&&x.c[1]>=1&&(sector==='any'||x.f[7]===sector)), radii=urgent?[25,50,100,200]:[25,50,150,300];
  let R=radii[radii.length-1];if(rad)R=rad;else for(const r of radii){if(ok.filter(x=>x.d<=r).length>=5){R=r;break;}}
  const pool=ok.filter(x=>x.d<=R);
  const top=(urgent?pool.sort((a,b)=>a.d-b.d):pool.sort((a,b)=>b.c[0]-a.c[0]||(b.c[12]||0)-(a.c[12]||0)||a.d-b.d)).slice(0,5);
  const off=all.filter(x=>x.d<=Math.max(R,top.length?top[top.length-1].d:R)&&(x.c[8]||x.c[1]===0)).sort((a,b)=>a.d-b.d).slice(0,4);
  const nextOut=ok.filter(x=>x.d>R).sort((a,b)=>a.d-b.d)[0];
  return{top,off,R,n:pool.length,all,nextOut};}

function parts(c){const co=CL[svc].coreq.length,share=co?c[3].length/co:0;
  const e1=c[2]===3?W.t3:(c[2]===2?W.t2:1), e2=Math.pow(W.coreq,share), e3=c[7]?W.ownurl:1;let C=1;const fired=[];
  for(let b=0;b<3;b++)if(c[6]>>b&1){C*=W[SIGNW[b]];fired.push(b);}
  return{e1,e2,e3,E:e1*e2*e3,C,fired,share};}
function reasonOff(x){const c=x.c;if(c[8])return'Left out by rule: this is a '+(NEGNAME[c[9]]||'single-specialty')+' facility and the service is outside its specialty, so the text probably belongs to another hospital.';
  const s=[];if(c[2]===1)s.push('only a loose mention of the service');for(let b=0;b<3;b++)if(c[6]>>b&1)s.push(SIGN[b].toLowerCase());if(!s.length)s.push('too little supporting text');return'Left out: weak evidence ('+s.join('; ')+').';}

function ladder(x){const f=x.f,c=x.c,co=CL[svc].coreq,found=new Set(c[3]),p=parts(c),sv=curSvc()[1].toLowerCase(),L=c[10]||['',0,'','','',''],mk=new Set();(CL[svc].must||[]).forEach(g=>g.k.forEach(k=>mk.add(k)));

  let h='<div class="ladder">';

  h+=rung(3,'Equipment and unit',!!L[4],(L[4]?(L[6]>=0?'<div class="rs">About '+esc(gl(co[L[6]]).toLowerCase())+':</div>':'')+q(L[4],L[5]):'<div class="rq">No sentence describes the unit or its machines</div>')+'<div class="rs" style="margin-top:6px">What '+esc(sv)+' needs, and whether the record mentions it:</div><div class="needs">'+chips+'</div>');

  const bad=p.fired.map(b=>SIGN[b]);if(!f[8])bad.push('No phone number on the record');

  return h+'</div>';}
function mustMiss(c){const co=CL[svc].coreq,must=CL[svc].must||[];return (c[11]||[]).map(k=>must[k]).filter(Boolean).map(g=>({name:g.k.map(k=>gl(co[k])).join(' or '),why:g.why}));}
function body(x,rank,r){const f=x.f,c=x.c,co=CL[svc].coreq,found=new Set(c[3]),p=parts(c),sv=curSvc()[1].toLowerCase(),miss=mustMiss(c),raw=c[12]!=null?c[12]:c[0];
  const asks=[...miss.map(m=>'Do you have this: '+m.name+'?'),'Is '+sv+' working today, and can you take a patient now?',...co.filter((n,k)=>!found.has(k)&&!/count|volume|spec/.test(n)).slice(0,miss.length?1:2).map(n=>'Do you have this: '+gl(n)+'?')].filter((a,k,arr)=>arr.indexOf(a)===k).slice(0,4);
  const why=urgent?'Number '+rank+' because it is the '+['','nearest','2nd nearest','3rd nearest','4th nearest','5th nearest'][rank]+' of '+r.n+' places within '+r.R+' km that passed the check.':'Number '+rank+' because it has the '+['','highest','2nd highest','3rd highest','4th highest','5th highest'][rank]+' trust score of '+r.n+' places within '+r.R+' km that passed the check.';
  const info=[];if(f[11]){if(f[11][0])info.push(f[11][0]+' beds');if(f[11][1])info.push(f[11][1]+' doctors');if(f[11][2])info.push('since '+f[11][2]);}

  h+='<details class="sub"><summary>Doctors named on this record'+(f[10]&&f[10].length?' ('+f[10].length+')':'')+'</summary><div class="inner">'+(f[10]&&f[10].length?'<ul class="ask">'+f[10].map(d=>'<li>'+esc(d)+'</li>').join('')+'</ul>':'<p class="small">None named in the record.</p>')+'<p class="small">Copied from the record, not verified; a doctor may also work elsewhere.'+(f[9]?' For qualifications and experience, see the facility\'s own site: <a href="https://'+esc(f[9].replace(/^https?:\/\//,''))+'" target="_blank" rel="noopener">'+esc(f[9])+'</a>':'')+'</p></div></details>';

function drawMap(r){if(map){map.remove();map=null;}if(!window.L||!$('map'))return;

function speak(x){if(!x)return;try{const en='For '+curSvc()[1]+', choice '+(last.top.indexOf(x)+1)+' is '+x.f[0]+' in '+x.f[1]+', about '+Math.round(x.d)+' kilometres away. '+TX.en['b'+x.c[1]]+'. '+(mustMiss(x.c).length?'First ask on the phone if they have: '+mustMiss(x.c).map(m=>m.name).join(', ')+'. ':'')+'Please call before you go.';const hi=curSvc()[2]+' के लिए विकल्प: '+x.f[0]+', '+x.f[1]+', लगभग '+Math.round(x.d)+' किलोमीटर दूर। '+TX.hi['b'+x.c[1]]+'। जाने से पहले फ़ोन करें।';const u=new SpeechSynthesisUtterance(lang==='hi'?hi:en);u.lang=lang==='hi'?'hi-IN':'en-IN';speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function results(){const r=search();last=r;open=0;const s=curSvc();let h='<div class="screen"><div class="chips"><button class="chip" data-go="1">'+esc(tr(s[1],s[2]))+'</button><button class="chip" data-go="2">'+(urgent?esc(T('u1')):esc(T('u0')))+'</button><button class="chip" data-go="3">'+esc(here.label)+'</button></div>';
  h+='<div class="res"><div class="mapcol"><div id="map"></div><p class="small" id="mapnote"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#2B6BE4;vertical-align:-1px"></span> you &nbsp; <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);vertical-align:-1px"></span> our choices, numbered &nbsp; <span style="display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid #8C8474;background:#fff;vertical-align:-1px"></span> mentions this service but was left out (weak evidence or wrong specialty). Distances are straight lines; roads are longer.</p></div><div class="listcol">';
  if(urgent)h+='<div class="banner red">Ambulance 108 · pregnancy and newborn 102 · any emergency 112</div>';
  h+='<div class="rule">'+(urgent?'<b>Emergency rule.</b> We first remove places with weak evidence or a rule violation. Then we list the <b>nearest</b> ones.':'<b>Planned rule.</b> We first remove places with weak evidence or a rule violation. Then, inside your area, we list the ones with the <b>highest trust score</b>.')+' Found '+r.n+' within '+r.R+' km.</div>';
  if(!r.top.length)h+='<div class="banner amber">No place with enough evidence within '+r.R+' km. This can mean there is no such care nearby, or that our table does not see it (it misses most public facilities).'+(r.nextOut?' Nearest one with evidence: '+esc(r.nextOut.f[0])+', '+esc(r.nextOut.f[1])+', about '+Math.round(r.nextOut.d)+' km.':'')+'</div>';
  h+='<div class="chips"><span class="small" style="align-self:center">Show</span>'+[['any','All'],['public','Public (low cost)'],['private','Private']].map(o=>'<button class="chip" data-sec="'+o[0]+'" aria-pressed="'+(sector===o[0])+'">'+o[1]+'</button>').join('')+'<span class="small" style="align-self:center;margin-left:8px">Within</span>'+[[0,'Auto'],[30,'30 km'],[50,'50 km'],[100,'100 km']].map(o=>'<button class="chip" data-rad="'+o[0]+'" aria-pressed="'+(rad===o[0])+'">'+o[1]+'</button>').join('')+'</div>';
  if(sector==='public')h+='<p class="small">Our table lists few public facilities (5% of rows). Your district hospital may not appear here.</p>';
  h+='<div id="cards" style="display:flex;flex-direction:column;gap:12px"></div>';
  const ah=areaHtml();if(ah)h+='<details><summary>'+esc(T('area'))+'</summary><div class="inner">'+ah+'</div></details>';
  if(r.off.length)h+='<details><summary>'+esc(T('notrec'))+' ('+r.off.length+')</summary><div class="inner">'+r.off.map(x=>'<div><b>'+esc(x.f[0])+'</b> <span class="small">· '+Math.round(x.d)+' km · '+esc(x.f[1])+'</span><p>'+esc(reasonOff(x))+'</p><p class="small">“'+esc(x.c[4])+'”</p></div>').join('')+'</div></details>';
  h+='<details><summary>Who can help, and what to take</summary><div class="inner"><p><b>People who can help.</b> Your village health worker (ASHA) or nurse (ANM) knows the nearest public facility. Free ambulance: 108. Free transport for pregnant women and newborns: 102. Any emergency: 112. Ayushman card questions: 14555.</p><p><b>What to take.</b> An ID such as Aadhaar. Your Ayushman card or ration card if you have one. For pregnancy or a child: the mother and child card (MCP card) and the vaccination card. Old prescriptions and test reports. The phone number shown on this page.</p><p class="small">Numbers are national; services differ by state.</p></div></details>';
  h+='<details><summary>'+esc(T('how'))+'</summary><div class="inner"><div class="flow">'
   +'<div class="step"><i>1</i><div><b>Find the sentences.</b> For each of 9,989 facility records we find every sentence about the service. A service word inside the hospital\'s own name does not count.</div></div>'
   +'<div class="step"><i>2</i><div><b>Grade the evidence.</b> Loose mention ×1, named procedure or unit ×'+W.t2+', equipment or unit with detail ×'+W.t3+'. Then up to ×'+W.coreq+' for the share of things the service needs (theatre, anaesthesia, blood…) found in the record, and ×'+W.ownurl+' if its own website has a page for it.</div></div>'
   +'<div class="step"><i>3</i><div><b>Check the row is one real place.</b> Map point, postcode and city all differ ×'+W.all_differ+'. Text names 2+ towns over 60 km away ×'+W.far2+'. Built from 2+ other organisations\' websites ×'+W.other_sites_2plus+'.</div></div>'
   +'<div class="step"><i>4</i><div><b>Score.</b> odds = '+M.base+' × evidence × one-real-place; trust = 100 × odds ÷ (1 + odds). Strong ≥ '+M.high+', some ≥ '+M.low+', weak below.</div></div>'
   +'<div class="step"><i>5</i><div><b>Must-have check.</b> Some things a service cannot run without (for example an operating theatre for a C-section). If the record does not mention one, the score stops at '+M.cap+', just under "strong", and the card says to confirm it by phone. The place stays on the list, because a silent record is not a "no".</div></div>'
   +'<div class="step"><i>6</i><div><b>Remove.</b> Weak evidence is removed. A single-specialty facility (eye, dental, skin, physio, ayurveda) claiming acute care outside its specialty is removed. Both are shown in the left-out list with the reason.</div></div>'
   +'<div class="step"><i>7</i><div><b>Rank.</b> Emergency: nearest first. Planned: highest trust first inside your area. The area starts at 25 km and widens until 5 places are found.</div></div></div>'
   +'<p><b>Where the numbers come from.</b> They are fitted on '+M.n_labelled+' claims whose answer we could establish, not chosen by hand. <b>Checks:</b> on unseen labelled claims the score separates real from false with AUC 0.88; 98% of "strong" are real, 82% of "some", 44% of "weak".</p><p><b>Limits.</b> The table is 5% public facilities. No text for a service does not mean the place lacks it. Distances are straight lines. The score is an index, not a probability. This tool does not diagnose. Always call first.</p></div></details>';
  h+='<button class="chip" id="again" style="align-self:center">↺ '+esc(T('again'))+'</button></div></div></div>';return h;}

function render(){const v=$('view');$('dots').innerHTML=[1,2,3,4].map(i=>'<i class="'+(i<=step?'on':'')+'"></i>').join('');$('back').style.visibility=step>1?'visible':'hidden';$('lang').textContent=lang==='en'?'हिन्दी':'English';
  if(step===1){v.innerHTML='<div class="screen"><div><h1>'+esc(T('q1'))+'</h1><p class="hint">'+esc(T('h1'))+'</p></div><div class="grid">'+NEEDS.map((n,i)=>'<button class="tile" data-n="'+n[0]+'"><span class="bub h'+(i%5)+'">'+ICON[n[0]]+'</span><b>'+esc(tr(n[1],n[2]))+'</b></button>').join('')+'</div><div class="other"><b>'+esc(tr('Not sure? Describe the problem in your own words','पक्का नहीं? अपनी भाषा में समस्या लिखें'))+'</b><div class="rowi"><input id="sym" placeholder="'+esc(tr('for example: fell from a bike and the leg is bleeding','जैसे: बाइक से गिर गए, पैर से खून बह रहा है'))+'" value="'+esc(typed)+'"><button class="gobtn" id="mic" style="background:var(--accent)">'+esc(tr('Speak','बोलें'))+'</button><button class="gobtn" id="symgo">'+esc(tr('Suggest','सुझाव'))+'</button></div>'+(sugg?'<div class="chips">'+sugg.map(k=>{const n=NEEDS.find(x=>x[0]===k);return '<button class="chip" data-sg="'+k+'" style="background:var(--accentbg);color:var(--accentink)">'+esc(tr(n[1],n[2]))+'</button>';}).join('')+'<button class="chip" data-sg="injury" style="background:var(--soft)">'+esc(tr('General hospital with emergency','आपातकाल वाला सामान्य अस्पताल'))+'</button></div><p class="small">'+esc(sugg.length?'These match your words. They are suggestions, not a diagnosis.':'We could not match your words to a category. A general hospital with an emergency department is the safe choice; in danger call 108.')+'</p>':'')+'</div><p class="small">This tool does not diagnose; a health worker or doctor decides what care is needed.</p></div>';
    const sg=()=>{typed=$('sym').value;sugg=KW.filter(k=>k[1].test(typed)).map(k=>k[0]).slice(0,3);render();};$('symgo').onclick=sg;$('mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('sym').placeholder='Voice input is not available in this browser. Please type.';return;}try{const r=new SR();r.lang=lang==='hi'?'hi-IN':'en-IN';r.onresult=e=>{$('sym').value=e.results[0][0].transcript;sg();};r.onerror=()=>{$('sym').placeholder='Could not hear you. Please type.';};r.start();$('mic').textContent='…';}catch(e){$('sym').placeholder='Voice input is not available here. Please type.';}};$('sym').addEventListener('keydown',e=>{if(e.key==='Enter')sg();});
    v.querySelectorAll('[data-sg]').forEach(b=>b.onclick=()=>{const n=NEEDS.find(x=>x[0]===b.dataset.sg);need=n[0];svc=n[4][0][0];urgent=!!n[3];step=2;render();});
    v.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const n=NEEDS.find(x=>x[0]===b.dataset.n);need=n[0];svc=n[4][0][0];urgent=!!n[3];step=2;render();});}
  else if(step===2){const n=curNeed();let h='<div class="screen narrow"><div><h1>'+esc(T('q2'))+'</h1><p class="hint">'+esc(tr(n[1],n[2]))+'</p></div>';
    if(n[4].length>1)h+='<div><p class="hint" style="margin-bottom:8px">'+esc(T('which'))+'</p><div class="chips">'+n[4].map(s=>'<button class="chip" data-s="'+s[0]+'" aria-pressed="'+(s[0]===svc)+'">'+esc(tr(s[1],s[2]))+'</button>').join('')+'</div></div>';
    h+='<div class="big"><button class="opt red" id="u1"><span class="bub">'+ICON.urgent+'</span><span><b>'+esc(T('u1'))+'</b><span>'+esc(T('u1s'))+'</span></span></button><button class="opt" id="u0"><span class="bub">'+ICON.plan+'</span><span><b>'+esc(T('u0'))+'</b><span>'+esc(T('u0s'))+'</span></span></button></div></div>';v.innerHTML=h;
    v.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{svc=b.dataset.s;render();});$('u1').onclick=()=>{urgent=true;step=3;render();};$('u0').onclick=()=>{urgent=false;step=3;render();};}
  else if(step===3){v.innerHTML='<div class="screen narrow"><div><h1>'+esc(T('q3'))+'</h1><p class="hint">'+esc(T('h3'))+'</p></div><input class="field" id="loc" list="cities" autocomplete="off" placeholder="'+esc(T('ph'))+'" value="'+esc(here&&here.label!=='My location'?here.label.replace(/^PIN /,''):'')+'"><datalist id="cities">'+Object.keys(D.cities).sort().map(c=>'<option value="'+esc(c)+'">').join('')+'</datalist>'+(locErr?'<p class="err">'+esc(locErr)+'</p>':'')+'<div class="chips">'+['Patna','Araria','Nashik','Jaipur','Gadchiroli','800001'].map(c=>'<button class="chip" data-c="'+c+'">'+c+'</button>').join('')+'</div><button class="cta" id="go">'+esc(T('go'))+'</button><button class="ghost" id="gps">'+esc(T('gps'))+'</button></div>';
    const go=q=>{const r=resolve(q!=null?q:$('loc').value);if(!r){locErr=T('nf');render();return;}locErr='';here=r;step=4;render();};
    $('go').onclick=()=>go();$('loc').addEventListener('keydown',e=>{if(e.key==='Enter')go();});v.querySelectorAll('.chip').forEach(b=>b.onclick=()=>go(b.dataset.c));
    $('gps').onclick=()=>{const fail=()=>{locErr='Location sharing is not available here. Type a PIN code or a town.';render();};try{navigator.geolocation.getCurrentPosition(p=>{here=nearPlace(p.coords.latitude,p.coords.longitude,'My location');locErr='';step=4;render();},fail,{timeout:8000});}catch(e){fail();}};}
  else{v.innerHTML=results();paintCards();v.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{sector=b.dataset.sec;render();});v.querySelectorAll('[data-rad]').forEach(b=>b.onclick=()=>{rad=+b.dataset.rad;render();});v.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{step=+b.dataset.go;render();});$('again').onclick=()=>{step=1;render();};drawMap(last);}
  window.scrollTo(0,0);}
$('back').onclick=()=>{if(step>1){step--;render();}};
$('lang').onclick=()=>{lang=lang==='en'?'hi':'en';render();};
render();
</script>
