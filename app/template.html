/* Layout: three short picture questions, then a delivery-app style answer: a real map on the left with you and five numbered places, a ranked list on the right; each card opens to WHY and HOW. */

*{box-sizing:border-box}

   +'<div class="step"><i>7</i><div><b>Rank.</b> Emergency: nearest first; places within '+M.tie_km+' km of each other count as equally near (the usual gap between a record\'s map point and its postcode centre), and among those stronger evidence goes first, then public. The same hospital listed twice is shown once. Planned: highest trust first inside your area; scores within '+M.tie_pts+' points count as equal (the score moves that much when refitted on resampled labels), and among those the nearer place goes first. In an emergency a place whose location we are unsure of goes after the others. The area is the smallest circle around you that holds 5 places that passed (steps from 25 to 300 km; from 10 to 200 km in an emergency).</div></div></div>'
   +'<p><b>Where the numbers come from.</b> The multipliers are fitted, not chosen by hand, on '+M.n_labelled+' claims we could label. '+V.n_name+' labels come from the facility\'s name alone (a kidney centre that claims dialysis is "likely real"; a dental clinic that claims dialysis is "likely false"). '+V.n_read+' were set after an AI reader read the record. <b>Nobody visited or phoned any facility, so "real" means "the record is believable", not "the service was seen working".</b></p>'
   +'<p><b>Checks, on claims held out from fitting.</b> The score puts a likely-real claim above a likely-false one '+Math.round(V.auc*100)+' times in 100 (AUC '+V.auc+'). It is weakest for '+esc((SVCNAME[V.svc_min]||V.svc_min).toLowerCase())+' (AUC '+V.svc_min_auc+'). Likely real: '+V.real[2]+'% of "strong" ('+V.n[2]+' claims), '+V.real[1]+'% of "some" ('+V.n[1]+'), '+V.real[0]+'% of "weak" ('+V.n[0]+'). The labelled claims are not a random sample, so read the score as an order, not as a probability.</p>'
   +'<p><b>Known weak points.</b> The warning "built from other organisations\' websites" partly measures how long a record is: with record length held fixed its multiplier moves from ×'+W.other_sites_2plus+' to about ×0.8. The "things this service needs" are searched in the whole record, so a match can come from another department. The strong and some cut-offs ('+M.high+' and '+M.low+') were set by us after looking at the labelled claims. The must-have rule is a medical precaution and does not make the strong grade more accurate on our labels.</p>'
   +'<p><b>Limits.</b> The table is 5% public facilities. No text for a service does not mean the place lacks it. Distances are straight lines. This tool does not diagnose. Always call first.</p></div></details>';
  h+='<button class="chip" id="again" style="align-self:center">↺ '+esc(T('again'))+'</button></div></div></div>';return h;}

function render(){const v=$('view');$('dots').innerHTML=[1,2,3,4].map(i=>'<i class="'+(i<=step?'on':'')+'"></i>').join('');$('back').style.visibility=step>1?'visible':'hidden';$('lang').textContent=lang==='en'?'हिन्दी':'English';
  if(step===1){v.innerHTML='<div class="screen"><div><h1>'+esc(T('q1'))+'</h1><p class="hint">'+esc(T('h1'))+'</p></div><div class="grid">'+NEEDS.map((n,i)=>'<button class="tile" data-n="'+n[0]+'"><span class="bub h'+(i%5)+'">'+ICON[n[0]]+'</span><b>'+esc(tr(n[1],n[2]))+'</b></button>').join('')+'</div><div class="other"><b>'+esc(tr('Not sure? Describe the problem in your own words','पक्का नहीं? अपनी भाषा में समस्या लिखें'))+'</b><div class="rowi"><input id="sym" placeholder="'+esc(tr('for example: fell from a bike and the leg is bleeding','जैसे: बाइक से गिर गए, पैर से खून बह रहा है'))+'" value="'+esc(typed)+'"><button class="gobtn" id="mic" style="background:var(--accent)">'+esc(tr('Speak','बोलें'))+'</button><button class="gobtn" id="symgo">'+esc(tr('Suggest','सुझाव'))+'</button></div>'+(sugg?'<div class="chips">'+sugg.map(k=>{const n=NEEDS.find(x=>x[0]===k);return '<button class="chip" data-sg="'+k+'" style="background:var(--accentbg);color:var(--accentink)">'+esc(tr(n[1],n[2]))+'</button>';}).join('')+'<button class="chip" data-sg="injury" style="background:var(--soft)">'+esc(tr('General hospital with emergency','आपातकाल वाला सामान्य अस्पताल'))+'</button></div><p class="small">'+esc(sugg.length?'These match your words. They are suggestions, not a diagnosis.':'We could not match your words to a category. A general hospital with an emergency department is the safe choice; in danger call 108.')+'</p>':'')+'</div><p class="small">This tool does not diagnose; a health worker or doctor decides what care is needed.</p></div>';
    const sg=()=>{typed=$('sym').value;sugg=KW.filter(k=>k[1].test(typed)).map(k=>k[0]).slice(0,3);render();};$('symgo').onclick=sg;$('mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('sym').placeholder='Voice input is not available in this browser. Please type.';return;}try{const r=new SR();r.lang=lang==='hi'?'hi-IN':'en-IN';r.onresult=e=>{$('sym').value=e.results[0][0].transcript;sg();};r.onerror=()=>{$('sym').placeholder='Could not hear you. Please type.';};r.start();$('mic').textContent='…';}catch(e){$('sym').placeholder='Voice input is not available here. Please type.';}};$('sym').addEventListener('keydown',e=>{if(e.key==='Enter')sg();});
    v.querySelectorAll('[data-sg]').forEach(b=>b.onclick=()=>{const n=NEEDS.find(x=>x[0]===b.dataset.sg);need=n[0];svc=n[4][0][0];urgent=!!n[3];step=2;render();});
    v.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const n=NEEDS.find(x=>x[0]===b.dataset.n);need=n[0];svc=n[4][0][0];urgent=!!n[3];step=2;render();});}
  else if(step===2){const n=curNeed();let h='<div class="screen narrow"><div><h1>'+esc(T('q2'))+'</h1><p class="hint">'+esc(tr(n[1],n[2]))+'</p></div>';
    if(n[4].length>1)h+='<div><p class="hint" style="margin-bottom:8px">'+esc(T('which'))+'</p><div class="chips">'+n[4].map(s=>'<button class="chip" data-s="'+s[0]+'" aria-pressed="'+(s[0]===svc)+'">'+esc(tr(s[1],s[2]))+'</button>').join('')+'</div></div>';
    h+='<div class="big"><button class="opt red" id="u1"><span class="bub">'+ICON.urgent+'</span><span><b>'+esc(T('u1'))+'</b><span>'+esc(T('u1s'))+'</span></span></button><button class="opt" id="u0"><span class="bub">'+ICON.plan+'</span><span><b>'+esc(T('u0'))+'</b><span>'+esc(T('u0s'))+'</span></span></button></div></div>';v.innerHTML=h;
    v.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{svc=b.dataset.s;render();});$('u1').onclick=()=>{urgent=true;step=3;render();};$('u0').onclick=()=>{urgent=false;step=3;render();};}
  else if(step===3){v.innerHTML='<div class="screen narrow"><div><h1>'+esc(T('q3'))+'</h1><p class="hint">'+esc(T('h3'))+'</p></div><div class="locbox"><input class="field" id="loc" autocomplete="off" placeholder="'+esc(T('ph'))+'" value="'+esc(here&&here.label!=='My location'?here.label.replace(/^PIN /,''):'')+'"><div id="sugg" class="sugg" hidden></div></div>'+(locErr?'<p class="err">'+esc(locErr)+'</p>':'')+'<div class="lab">'+esc(tr('Or tap your city','या अपना शहर चुनें'))+'</div><div class="cities">'+CITYPIC.map(c=>c[0]==='_village'?'<button class="cityb" data-vil="1"><span>'+cityIcon(c[1])+'</span>'+esc(tr('Village or town','गाँव या कस्बा'))+'</button>':'<button class="cityb" data-c="'+c[0]+'"><span>'+cityIcon(c[1])+'</span>'+esc(c[0])+'</button>').join('')+'</div><button class="cta" id="go">'+esc(T('go'))+'</button><button class="ghost" id="gps">'+esc(T('gps'))+'</button></div>';
    const go=q=>{const r=resolve(q!=null?q:$('loc').value);if(!r){locErr=T('nf');render();return;}locErr='';here=r;step=4;render();};
    $('go').onclick=()=>go();$('loc').addEventListener('keydown',e=>{if(e.key==='Enter')go();});v.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>go(b.dataset.c));v.querySelector('[data-vil]').onclick=()=>{$('loc').focus();$('loc').placeholder=tr('Type your village, town or 6-digit PIN','अपना गाँव, कस्बा या 6 अंकों का पिन लिखें');};
    const sg=$('sugg');$('loc').addEventListener('input',()=>{const q=$('loc').value.trim().toLowerCase();if(!q){sg.hidden=true;return;}let rows=[];
      if(/^\d{2,6}$/.test(q))rows=Object.keys(D.pins).filter(p=>p.startsWith(q)).slice(0,7).map(p=>['PIN '+p,PL[D.pins[p][2]],p]);
      else{const ks=Object.keys(CITY),sz=k=>{const c=CITY[k];let n=0;for(const f of FAC)if(Math.abs(f[3]-c[1])<.12&&Math.abs(f[4]-c[2])<.12)n++;return n;};const a1=ks.filter(k=>k.startsWith(q)).slice(0,60).map(k=>[k,sz(k)+(PL[CITY[k][3]]&&PL[CITY[k][3]][1].toLowerCase()===k?1e5:0)]).sort((x,y)=>y[1]-x[1]).map(x=>x[0]);rows=a1.concat(ks.filter(k=>!k.startsWith(q)&&k.includes(q))).slice(0,7).map(k=>[CITY[k][0],PL[CITY[k][3]],CITY[k][0]]);}
      sg.innerHTML='<button class="srow gpsrow" data-gp="1"><span class="si">'+ICON['geo-location']+'</span><b>'+esc(T('gps'))+'</b></button>'+rows.map(r=>'<button class="srow" data-q="'+esc(r[2])+'"><span class="si">⌕</span><span><b>'+esc(r[0])+'</b><span class="small">'+esc(r[1]?r[1][1]+', '+r[1][0]:'')+'</span></span></button>').join('');sg.hidden=false;
      sg.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>go(b.dataset.q));sg.querySelector('[data-gp]').onclick=()=>$('gps').click();});
    $('gps').onclick=()=>{const fail=()=>{locErr='Location sharing is not available here. Type a PIN code or a town.';render();};try{navigator.geolocation.getCurrentPosition(p=>{here=nearPlace(p.coords.latitude,p.coords.longitude,'My location');locErr='';step=4;render();},fail,{timeout:8000});}catch(e){fail();}};}
  else{v.innerHTML=results();paintCards();wireAsha();v.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{sector=b.dataset.sec;render();});v.querySelectorAll('[data-rad]').forEach(b=>b.onclick=()=>{rad=+b.dataset.rad;render();});v.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{step=+b.dataset.go;render();});$('again').onclick=()=>{step=1;render();};drawMap(last);}
  window.scrollTo(0,0);}
$('back').onclick=()=>{if(step>1){step--;render();}};
$('lang').onclick=()=>{lang=lang==='en'?'hi':'en';render();};
render();
</script>
